<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- 背景 -->
  <rect width="100" height="100" rx="22" fill="#FFB3C6"/>

  <!-- 飘起来的笔记本（倾斜 -10°，带阴影） -->
  <g transform="rotate(-10, 44, 38)">
    <!-- 阴影 -->
    <rect x="14" y="14" width="58" height="50" rx="6" fill="#9D174D" opacity="0.18" transform="translate(3,5)"/>
    <!-- 本体（白色页面） -->
    <rect x="14" y="14" width="58" height="50" rx="6" fill="#fff"/>
    <!-- 顶部装订条 -->
    <rect x="14" y="14" width="58" height="12" rx="6" fill="#F472B6"/>
    <rect x="14" y="20" width="58" height="6" fill="#F472B6"/>
    <!-- 装订圆环 -->
    <circle cx="23" cy="20" r="3" fill="none" stroke="#BE185D" stroke-width="2"/>
    <circle cx="33" cy="20" r="3" fill="none" stroke="#BE185D" stroke-width="2"/>
    <circle cx="43" cy="20" r="3" fill="none" stroke="#BE185D" stroke-width="2"/>
    <circle cx="53" cy="20" r="3" fill="none" stroke="#BE185D" stroke-width="2"/>
    <circle cx="63" cy="20" r="3" fill="none" stroke="#BE185D" stroke-width="2"/>
    <!-- 页面横线 -->
    <line x1="23" y1="36" x2="67" y2="36" stroke="#FCE7F3" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="23" y1="44" x2="67" y2="44" stroke="#FCE7F3" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="23" y1="52" x2="60" y2="52" stroke="#FCE7F3" stroke-width="2.2" stroke-linecap="round"/>
  </g>

  <!-- 漂浮光点（营造飘起感） -->
  <circle cx="82" cy="17" r="2"   fill="#fff" opacity="0.75"/>
  <circle cx="88" cy="30" r="1.4" fill="#fff" opacity="0.55"/>
  <circle cx="11" cy="55" r="1.8" fill="#fff" opacity="0.60"/>

  <!-- 右下角樱花（8片花瓣） -->
  <g transform="translate(76, 78)">
    <ellipse cx="0" cy="-8" rx="3.2" ry="6.2" fill="#fff" opacity="0.93" transform="rotate(0)"/>
    <ellipse cx="0" cy="-8" rx="3.2" ry="6.2" fill="#fff" opacity="0.93" transform="rotate(45)"/>
    <ellipse cx="0" cy="-8" rx="3.2" ry="6.2" fill="#fff" opacity="0.93" transform="rotate(90)"/>
    <ellipse cx="0" cy="-8" rx="3.2" ry="6.2" fill="#fff" opacity="0.93" transform="rotate(135)"/>
    <ellipse cx="0" cy="-8" rx="3.2" ry="6.2" fill="#fff" opacity="0.93" transform="rotate(180)"/>
    <ellipse cx="0" cy="-8" rx="3.2" ry="6.2" fill="#fff" opacity="0.93" transform="rotate(225)"/>
    <ellipse cx="0" cy="-8" rx="3.2" ry="6.2" fill="#fff" opacity="0.93" transform="rotate(270)"/>
    <ellipse cx="0" cy="-8" rx="3.2" ry="6.2" fill="#fff" opacity="0.93" transform="rotate(315)"/>
    <!-- 花心 -->
    <circle cx="0" cy="0" r="4.8" fill="#F9A8D4"/>
    <circle cx="0" cy="0" r="2.8" fill="#EC4899"/>
  </g>
</svg>
